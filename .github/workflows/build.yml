name: Build Scale UI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Scale UI project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -type f -iname "*.zip" ! -path "./.git/*" -print | sort | head -n 1)
          test -n "$ZIP_FILE"
          rm -rf extracted workspace
          mkdir -p extracted workspace
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_ROOT=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit | xargs -r dirname)
          test -n "$PROJECT_ROOT"
          cp -a "$PROJECT_ROOT/." workspace/
          test -f workspace/settings.gradle.kts || test -f workspace/settings.gradle
          test -d workspace/app

      - name: Patch Compose pointer compatibility
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          find app/src/main/java -type f -name '*.kt' -print0 | while IFS= read -r -d '' file; do
            sed -i '/^import androidx\.compose\.ui\.input\.pointer\.consume$/d' "$file"
            sed -i '/^[[:space:]]*change\.consume()[[:space:]]*$/d' "$file"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Build Debug APK
        working-directory: workspace
        run: gradle clean assembleDebug --stacktrace --no-daemon

      - name: Sign and verify APK
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)
          test -n "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          KEYSTORE="$RUNNER_TEMP/scaleui-debug.keystore"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass android -keypass android -alias scaleui -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Scale UI Launcher, OU=Debug, O=Scale UI, C=IN" -noprompt
          ALIGNED="${APK%.apk}-aligned.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android --ks-key-alias scaleui --out "$APK" "$ALIGNED"
          rm -f "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          echo "SIGNED APK: $APK"
          ls -lh "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ScaleUI-debug-apk-signed
          path: workspace/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
