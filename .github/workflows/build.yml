name: Build Scale UI APK

on:
  workflow_dispatch:

  push:
    paths:
      - "**/*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Find and extract project ZIP
      - name: Extract Scale UI project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" \
            ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No project ZIP found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_ROOT=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Gradle project not found inside ZIP."
            exit 1
          fi

          echo "Project root: $PROJECT_ROOT"

          rm -rf workspace
          mkdir -p workspace

          cp -a "$PROJECT_ROOT/." workspace/

          echo "Project extracted successfully."

          ls -la workspace


      # 3. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # 4. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # 5. Android licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true


      # 6. Install Gradle 8.6
      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"


      # 7. Check Gradle
      - name: Check Gradle
        run: |
          gradle --version


      # 8. Build APK
      - name: Build Debug APK
        working-directory: workspace
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon


      # 9. Find APK
      - name: Verify APK
        working-directory: workspace
        shell: bash
        run: |
          set -e

          APK=$(find . \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "================================"
          echo "APK BUILD SUCCESSFUL"
          echo "================================"
          echo "APK: $APK"

          ls -lh "$APK"


      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScaleUI-debug-apk
          path: workspace/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
