name: Build Scale UI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Scale UI project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -type f -iname "*.zip" ! -path "./.git/*" -print | sort | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No project ZIP found."
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          rm -rf extracted workspace
          mkdir -p extracted workspace
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_ROOT=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Gradle project not found inside ZIP."
            exit 1
          fi
          cp -a "$PROJECT_ROOT/." workspace/
          echo "Project root: $PROJECT_ROOT"
          test -f workspace/settings.gradle.kts || test -f workspace/settings.gradle
          test -d workspace/app

      - name: Patch Compose pointer imports
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if grep -q 'change\.consume()' "$file" && ! grep -q 'import androidx\.compose\.ui\.input\.pointer\.consume$' "$file"; then
              if grep -q '^import androidx\.compose\.ui\.input\.pointer\.pointerInput$' "$file"; then
                sed -i '/^import androidx\.compose\.ui\.input\.pointer\.pointerInput$/a import androidx.compose.ui.input.pointer.consume' "$file"
              else
                sed -i '/^import androidx\.compose\.ui\./a import androidx.compose.ui.input.pointer.consume' "$file"
              fi
            fi
          done < <(find app/src/main/java -type f -name '*.kt' -print0)
          echo "Patched consume imports where required."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Build Debug APK
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi
          echo "APK BUILD SUCCESSFUL: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScaleUI-debug-apk
          path: workspace/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
